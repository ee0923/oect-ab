name: Build OECT Armbian

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oect-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare locked source
        run: bash scripts/prepare-source.sh source
      - name: Load verified customization from KV
        env:
          PATCH_BOOTSTRAP: ${{ secrets.CUSTOMIZE_SCRIPT }}
        run: |
          set +x
          set -euo pipefail
          : "${PATCH_BOOTSTRAP:?Set CUSTOMIZE_SCRIPT to the fixed KV bootstrap}"
          umask 077
          export SOURCE="$GITHUB_WORKSPACE/source"
          bootstrap=$(mktemp "$RUNNER_TEMP/oect-bootstrap.XXXXXX")
          trap 'rm -f "$bootstrap"' EXIT
          printf '%s\n' "$PATCH_BOOTSTRAP" > "$bootstrap"
          unset PATCH_BOOTSTRAP
          bash "$bootstrap"
          python3 scripts/verify-source.py source
      - name: Check privacy regressions
        run: python3 source/userpatches/oect-privacy-test.py
      - name: Download and verify Debian 13 base
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/download-base.py
      - name: Build and inspect OECT disk image
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OECT-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OECT-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OECT-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish verified image and build evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "OECT Armbian build $GITHUB_RUN_NUMBER" \
            --notes "Original wxy-oect only. Debian 13 server, rk35xx 6.12. Image and privacy inspection passed; hardware boot is not tested. Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            dist/*
